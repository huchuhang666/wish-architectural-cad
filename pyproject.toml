[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wish-architectural-cad"
version = "0.1.0"
description = "Generate editable architectural plans, elevations, and sections from JSON"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "ezdxf>=1.4,<2",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "contourpy>=1.2,<2",
    "Pillow>=10,<13",
]

[project.scripts]
wish-cad = "wish_cad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
