[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wish-architectural-cad"
version = "0.2.0"
description = "Generate editable architectural plans, elevations, and sections from JSON"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "ezdxf>=1.4,<2",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "contourpy>=1.2,<2",
    "Pillow>=10,<13",
]

[project.optional-dependencies]
desktop = [
    "mcp>=1.20,<2",
    "photoshop-python-api>=0.24,<1; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
]
autocad-mcp = ["autocad-mcp-pro[com]==1.6.0; sys_platform == 'win32'"]

[project.scripts]
wish-cad = "wish_cad.cli:main"
wish-cad-mcp = "wish_cad.desktop.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
